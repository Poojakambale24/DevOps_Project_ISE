apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ise-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-ise
  template:
    metadata:
      labels:
        app: devops-ise
    spec:
      containers:
      - name: devops-ise-container
        image: 24032004/devops_ise_project:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-ise-service
spec:
  selector:
    app: devops-ise
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30007
  type: NodePort
